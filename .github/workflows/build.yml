name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\DeepSeekChat\DeepSeekChat.csproj

      - name: Build Release
        run: dotnet build .\DeepSeekChat\DeepSeekChat.csproj --configuration Release --no-restore

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekChat-VSIX
          path: DeepSeekChat\bin\Release\**\DeepSeekChat.vsix
          if-no-files-found: warn
